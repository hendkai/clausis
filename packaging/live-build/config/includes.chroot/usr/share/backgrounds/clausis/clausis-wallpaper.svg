<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     width="2560" height="1440" viewBox="0 0 2560 1440">
  <defs>
    <radialGradient id="field" cx="76%" cy="48%" r="68%">
      <stop offset="0" stop-color="#17234a"/>
      <stop offset="0.52" stop-color="#0d1228"/>
      <stop offset="1" stop-color="#070a17"/>
    </radialGradient>
    <linearGradient id="signal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#20d8f2"/>
      <stop offset="1" stop-color="#7937e8"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
    <clipPath id="right-field">
      <rect x="1080" y="0" width="1480" height="1440"/>
    </clipPath>
  </defs>

  <rect width="2560" height="1440" fill="url(#field)"/>

  <!-- A quiet desktop zone remains on the left; the listening field lives on the right. -->
  <g clip-path="url(#right-field)" fill="none" stroke="url(#signal)">
    <circle cx="1980" cy="720" r="390" stroke-width="4" opacity="0.13"/>
    <circle cx="1980" cy="720" r="520" stroke-width="3" opacity="0.09"/>
    <circle cx="1980" cy="720" r="650" stroke-width="2" opacity="0.06"/>
    <path d="M1080 1120 C1280 1040 1410 1190 1580 1100 S1900 1010 2070 1090 S2360 1200 2560 1090"
          stroke-width="80" opacity="0.05" filter="url(#glow)"/>
    <path d="M1080 1120 C1280 1040 1410 1190 1580 1100 S1900 1010 2070 1090 S2360 1200 2560 1090"
          stroke-width="3" opacity="0.22"/>
  </g>

  <circle cx="1980" cy="720" r="360" fill="#20d8f2" opacity="0.05" filter="url(#glow)"/>
  <!-- Three small pulses identify the system as listening without imitating a status light. -->
  <g fill="url(#signal)" opacity="0.82">
    <rect x="176" y="1262" width="8" height="28" rx="4"/>
    <rect x="194" y="1252" width="8" height="48" rx="4"/>
    <rect x="212" y="1260" width="8" height="32" rx="4"/>
  </g>
</svg>
