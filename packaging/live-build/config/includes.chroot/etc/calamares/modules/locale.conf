---
# Start deterministically offline. Calamares otherwise performs an HTTPS
# GeoIP lookup while the Welcome page is already visible, which can keep its
# shared module-completion gate waiting indefinitely. Users can still choose a
# different location and timezone on the following page.
region: "Europe"
zone: "Berlin"
geoip:
    style: "none"
    url: "https://geoip.kde.org/v1/calamares"
    selector: ""
