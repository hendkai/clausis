---
showSupportUrl: true
showKnownIssuesUrl: true
showReleaseNotesUrl: true

# UPower can leave Calamares's asynchronous welcome requirements job waiting
# indefinitely in the VirtualBox live session. Power was never a required
# condition in Debian's configuration. Keep every required safety check and
# omit only that optional probe so the installer can reach its first page.
requirements:
    requiredStorage: 15
    requiredRam: 1.0
    check:
        - storage
        - ram
        - root
    required:
        - storage
        - ram
        - root
