# Clausis echo cancellation.
#
# Barge-in is only safe when the microphone does not hear the speaker: without
# cancellation Clausis detects its own voice and interrupts itself forever.
# clausis.barge_in therefore refuses to arm unless echo cancellation is both
# present and certified for the hardware profile.
#
# Loading this module alone does NOT enable full duplex. The
# "echo_cancellation" and "interrupt_detector" flags in
# /etc/clausis/audio-certified.json are written only after the false-accept
# rate and the interruption latency have been measured on that hardware.
context.modules = [
  { name = libpipewire-module-echo-cancel
    args = {
      # Keep the raw devices available so the trusted confirmation service can
      # still capture on a path that is not shared with the desktop graph.
      capture.props = {
        node.name  = "clausis_echo_cancel_capture"
        node.description = "Clausis Echo-Cancelled Microphone"
      }
      source.props = {
        node.name  = "clausis_echo_cancel_source"
        node.description = "Clausis Voice Input"
      }
      playback.props = {
        node.name  = "clausis_echo_cancel_playback"
      }
      sink.props = {
        node.name  = "clausis_echo_cancel_sink"
        node.description = "Clausis Voice Output"
      }
      aec.args = {
        webrtc.gain_control = true
        webrtc.echo_suppression_level = "high"
        webrtc.noise_suppression = true
        webrtc.voice_detection = true
      }
    }
  }
]
