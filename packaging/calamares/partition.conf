---

# Never preselect the destructive erase option. Clausis will only permit it
# after target binding and a protected spoken confirmation are complete.
initialPartitioningChoice: none
initialSwapChoice: file
userSwapChoices: [ file ]

efi:
  mountPoint: "/boot/efi"
  recommendedSize: 512MiB
  minimumSize: 256MiB
  label: "CLAUSIS_EFI"

# An unencrypted /boot lets the firmware and GRUB load the initramfs without
# placing an automatic plaintext key next to it. Root remains LUKS2 encrypted.
luksGeneration: luks2
enableLuksAutomatedPartitioning: true
preCheckEncryption: true
showNotEncryptedBootMessage: true

defaultFileSystemType: "btrfs"
availableFileSystemTypes: [ "btrfs" ]

# The subvolume layout is what makes the snapshot rollback safe. Everything
# outside "@" is deliberately outside the rollback boundary: undoing a bad
# update must never erase the tamper-evident audit chain in /var/log/clausis,
# the record of which Hermes release is installed, or the user's documents.
# The authoritative definition, with a reason per entry, lives in
# clausis.subvolumes; a test asserts that this file still matches it.
btrfsSubvolumes:
  - subvolume: "/@"
    mountPoint: "/"
  - subvolume: "/@home"
    mountPoint: "/home"
  - subvolume: "/@snapshots"
    mountPoint: "/.snapshots"
  - subvolume: "/@var-log"
    mountPoint: "/var/log"
  - subvolume: "/@var-lib-clausis"
    mountPoint: "/var/lib/clausis"
  - subvolume: "/@var-cache"
    mountPoint: "/var/cache"
  - subvolume: "/@var-tmp"
    mountPoint: "/var/tmp"
  - subvolume: "/@swap"
    mountPoint: "/swap"
partitionLayout:
  - name: "CLAUSIS_BOOT"
    filesystem: "ext4"
    noEncrypt: true
    mountPoint: "/boot"
    size: 1G
    minSize: 768M
  - name: "CLAUSIS_ROOT"
    type: "4f68bce3-e8cd-4db1-96e7-fbcaf984b709"
    filesystem: "btrfs"
    noEncrypt: false
    mountPoint: "/"
    size: 100%
    minSize: 24G

allowManualPartitioning: true
essentialMounts: [ "live-*", "control", "ventoy" ]
lvm:
  enable: false

