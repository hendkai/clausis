---
id: voiceos
name: VoiceOS secure voice installer
interface: process
command: /usr/libexec/calamares-voiceos
timeout: 30
requirements:
  - pipewire
  - speech-dispatcher
  - espeak-ng
security:
  storeRawAudio: false
  allowSecretsInPlan: false
  confirmationTtlSeconds: 30
fallback:
  keyboard: true
  orca: true
  recoveryBootEntry: true

