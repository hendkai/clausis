<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy user="clausis-broker">
    <allow own="org.clausis.ActionBroker1"/>
  </policy>
  <policy user="clausis-confirm">
    <allow own="org.clausis.TrustedConfirm1"/>
  </policy>
  <policy group="clausis">
    <allow send_destination="org.clausis.ActionBroker1"/>
    <allow send_destination="org.clausis.TrustedConfirm1"
           send_interface="org.clausis.TrustedConfirm1"/>
  </policy>
  <policy context="default">
    <deny own="org.clausis.ActionBroker1"/>
    <deny own="org.clausis.TrustedConfirm1"/>
    <deny send_destination="org.clausis.TrustedConfirm1"/>
  </policy>
</busconfig>
