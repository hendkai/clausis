<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy user="voiceos-broker">
    <allow own="org.voiceos.ActionBroker1"/>
  </policy>
  <policy user="voiceos-confirm">
    <allow own="org.voiceos.TrustedConfirm1"/>
  </policy>
  <policy group="voiceos">
    <allow send_destination="org.voiceos.ActionBroker1"/>
    <allow send_destination="org.voiceos.TrustedConfirm1"
           send_interface="org.voiceos.TrustedConfirm1"/>
  </policy>
  <policy context="default">
    <deny own="org.voiceos.ActionBroker1"/>
    <deny own="org.voiceos.TrustedConfirm1"/>
    <deny send_destination="org.voiceos.TrustedConfirm1"/>
  </policy>
</busconfig>

