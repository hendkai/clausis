# Test-only ALSA endpoints for an external QEMU installation harness.
#
# Playback is captured for evidence and challenge recovery. Capture blocks on
# a FIFO until the harness injects synthesized microphone audio. This file is
# never copied into the live ISO or installed system.
pcm.clausis_test_playback {
    type file
    slave.pcm {
        type null
    }
    file "/artifacts/clausis-install-audio-output.raw"
    format "raw"
}

pcm.clausis_test_capture {
    type file
    slave.pcm {
        type null
    }
    file "/dev/null"
    infile "/tmp/clausis-install-audio-input.fifo"
    format "raw"
}

pcm.clausis_test_duplex {
    type asym
    playback.pcm "clausis_test_playback"
    capture.pcm "clausis_test_capture"
}
