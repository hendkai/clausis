name: AT-SPI session smoke

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  atspi-session:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Run the session-level AT-SPI smoke test (Debian container)
        run: |
          # firefox-esr is a native Debian package and the reason neither
          # session runs directly on the Ubuntu runner: both ride inside a
          # debian:13-slim container (Xvfb + dbus session + at-spi bus +
          # matchbox WM) that installs the exact Debian packages of the
          # target OS.
          #   gtk      real GTK probe app: text editing, say-all, list jump
          #   browser  firefox-esr loads the local probe page via file://
          #            and the client drives structure jumps against the
          #            browser-published AT-SPI roles (BLIND §2/§4).
          # The container exit code propagates client failures; result
          # files are flushed after every step and printed by the script
          # even when the container itself failed.
          scripts/atspi_session_smoke.sh all
      - name: Show session results and logs
        if: always()
        run: |
          for f in session-result.txt browser-result.txt app-marker.txt \
                   firefox.log atspi.log app.log; do
            p="/tmp/clausis-session/${f}"
            if [ -f "$p" ]; then
              echo "--- ${f} ---"
              tail -80 "$p"
            fi
          done
      - name: Fail on errors
        if: always()
        run: |
          # Belt and braces: the client exit codes already propagate
          # through the container, but a missing or ERROR-carrying result
          # file must never pass either.
          fail=0
          for f in session-result.txt browser-result.txt; do
            p="/tmp/clausis-session/${f}"
            if [ ! -s "$p" ]; then
              echo "No result was produced in ${f}"
              fail=1
            elif grep -q '^ERROR ' "$p"; then
              echo "Session test reported ERROR lines in ${f}"
              fail=1
            fi
          done
          exit "$fail"
