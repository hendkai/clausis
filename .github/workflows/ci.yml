name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --no-deps -e .
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q src scripts tests
      - name: Confirm release remains fail-closed while blockers exist
        run: |
          if python scripts/check_release.py; then
            echo "Prototype unexpectedly passed the end-user release gate"
            exit 1
          fi

